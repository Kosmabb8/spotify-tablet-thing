name: Signed Android Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      CARTHING_STORE_PASSWORD: ${{ secrets.CARTHING_STORE_PASSWORD }}
      CARTHING_KEY_PASSWORD: ${{ secrets.CARTHING_KEY_PASSWORD }}
      CARTHING_KEY_ALIAS: ${{ secrets.CARTHING_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: gradle/actions/wrapper-validation@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Require all signing secrets
        shell: bash
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$CARTHING_STORE_PASSWORD"
          test -n "$CARTHING_KEY_PASSWORD"
          test -n "$CARTHING_KEY_ALIAS"
      - name: Decode temporary signing keystore
        shell: bash
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/controller-release.jks"
      - name: Test, lint, and build signed APK
        run: >-
          ./gradlew check assembleRelease
          -PCARTHING_KEYSTORE=${{ runner.temp }}/controller-release.jks
          -PCARTHING_KEY_ALIAS=${{ secrets.CARTHING_KEY_ALIAS }}
      - name: Verify and name release files
        shell: bash
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/spotify-car-controller-tb-x505f-${GITHUB_REF_NAME}.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "release/spotify-car-controller-tb-x505f-${GITHUB_REF_NAME}.apk"
          cd release
          sha256sum *.apk > SHA256SUMS.txt
      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --generate-notes --verify-tag
      - name: Remove temporary keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/controller-release.jks"
