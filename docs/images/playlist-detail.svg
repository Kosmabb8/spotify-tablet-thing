  <text x="455" y="226" fill="#d7c9c1" font-family="Segoe UI,Arial,sans-serif" font-size="20">Demo Curator</text>
  <text x="455" y="263" fill="#a99184" font-family="Segoe UI,Arial,sans-serif" font-size="17">12 songs</text>
