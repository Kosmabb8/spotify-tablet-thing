<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">Playlist detail interface preview</title>
  <desc id="desc">Fictional demonstration of the in-app playlist track browser.</desc>
