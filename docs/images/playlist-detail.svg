    <linearGradient id="bg"><stop stop-color="#28140c"/><stop offset="1" stop-color="#693219"/></linearGradient>
    <linearGradient id="art" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#ee7135"/><stop offset=".52" stop-color="#9f3d68"/><stop offset="1" stop-color="#3b55a6"/></linearGradient>
  </defs>
  <rect width="1280" height="800" fill="url(#bg)"/>
  <rect x="14" y="110" width="64" height="420" rx="26" fill="#1a0e09" opacity=".88"/>
  <circle cx="46" cy="235" r="22" fill="#e87538"/><text x="46" y="245" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="27">▪▪</text>
